version: 2
updates:
  # Single npm entry at root. Dependabot's pnpm-workspace mode reads
  # dependencies from ALL workspace package.json files via the root
  # lockfile, so this one entry covers the root's devDependencies *and*
  # every service's production + development deps.
  #
  # Historical note: earlier versions of this config had additional
  # per-workspace entries (directory: /services/bot-client, etc.) which
  # produced redundant PRs every week — a shared dep like discord.js
  # would land in both the root production-dependencies PR and the
  # per-service PR with a partial lockfile update that failed CI. The
  # simplified form below produces two PRs per week (prod group + dev
  # group) that each cover the whole repo cleanly.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    target-branch: 'develop'
    open-pull-requests-limit: 5
    reviewers:
      - 'lbds137'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
      development-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
    ignore:
      # NOTE: dependabot reads this file from the DEFAULT branch (main), so an
      # entry added here on develop is inert until the next release. For
      # immediate effect, pair the entry with the chat command on the open PR
      # (`@dependabot ignore <dep> major version`) — that ignore is stored
      # server-side and persists until `@dependabot unignore`. Removing an
      # entry below therefore ALSO requires the matching unignore comment.
      # jscpd 5.x is a fresh Rust rewrite (5.0.4 shipped 2026-06-08, v4 still
      # maintained in parallel) that drops the `.jscpd.json` `ignore` key — only
      # the CLI `--ignore-pattern` works — and shifts detection counts vs the JS
      # engine. Pinned to 4.x until the CPD tooling is migrated — tracked as
      # TASK-142 ("Migrate CPD tooling to jscpd 5").
      - dependency-name: 'jscpd'
        update-types: ['version-update:semver-major']
      # TypeScript 7.x is not yet supported by typescript-eslint —
      # @typescript-eslint/typescript-estree crashes at parse time under TS 7
      # ("Cannot read properties of undefined (reading 'Cjs')"), which turns
      # every dev-deps group PR carrying the major permanently red. Take the
      # TS 7 upgrade deliberately once typescript-eslint ships support, then
      # remove this ignore. Tracked as TASK-258.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # BullMQ 6 is a breaking major: `repeat` is gone from JobsOptions (v6
      # replaces repeatable jobs with the Job Schedulers API), and our
      # lock/stall tuning was verified against 5.x internals — the upgrade is
      # a deliberate migration, not a bump. Tracked as TASK-410; remove this
      # ignore in the migration PR.
      - dependency-name: 'bullmq'
        update-types: ['version-update:semver-major']
      # ioredis 6 rides the same migration: bullmq 5.x hard-pins ioredis 5.11.1
      # (dual-install + type clashes at the shared-connection seam), while
      # bullmq 6 takes ioredis as a peer (>=5). Upgrade both in TASK-410's PR;
      # remove this ignore there too.
      - dependency-name: 'ioredis'
        update-types: ['version-update:semver-major']
      # @types/node tracks the Node runtime major pinned in .node-version
      # (Dockerfiles, CI and engines all follow it; node-version-pin.test.ts
      # in packages/tooling enforces the match). A types major ahead of the
      # runtime admits APIs prod does not have, so the types move only
      # together with the runtime, in a deliberate bump of .node-version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # GitHub Actions workflow file dependencies — separate ecosystem.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    target-branch: 'develop'
    open-pull-requests-limit: 5
    reviewers:
      - 'lbds137'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    ignore:
      # claude-code-action bumps claude-code-review.yml + claude.yml — the two
      # files guard:workflow-sync requires to land via a main-cut branch — so a
      # develop-based bump PR fails CI on every run and never merges. The
      # main-targeting entry below owns this dependency instead. TASK-1233.
      #
      # actions/checkout is deliberately NOT routed: it is pinned in both
      # guarded workflows AND across ci.yml, so routing it to main would
      # strand ci.yml's ref behind develop. A checkout bump still trips the
      # guard on develop; each occurrence uses the manual cherry-pick path in
      # tzurot-git-workflow. TASK-1275.
      - dependency-name: 'anthropics/claude-code-action'

  # claude-code-action only, against MAIN: main-cut is where the guard allows
  # those two workflow files to change, so the bump lands where it can actually
  # merge (the guard self-skips on a main-cut branch). Dependabot reads this
  # file from the DEFAULT branch, so this whole split is inert until the next
  # release cut; the develop-based bump PR open at that moment is closed by
  # then (by dependabot or by hand).
  #
  # Merge follow-up: merging one of these PRs puts main ahead of develop on
  # the two guarded files, and guard:workflow-sync diffs origin/main against
  # HEAD — so every develop-based PR fails the guard until develop carries
  # the change. Run `pnpm ops release:finalize` right after such a merge.
  #
  # Race note: dependabot pushes the branch before it opens the PR, and CI
  # runs on push — if the lint job reaches the guard before the PR exists,
  # the guard fails closed and that first run is red. Once the PR exists,
  # `gh run rerun <run-id> --failed` fixes it; no cherry-pick needed.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    target-branch: 'main'
    open-pull-requests-limit: 2
    reviewers:
      - 'lbds137'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    allow:
      - dependency-name: 'anthropics/claude-code-action'
