[project]
name = "voice-engine"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 120
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade,
# B: flake8-bugbear, SIM: flake8-simplify, RUF: ruff-specific
lint.select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: FastAPI uses File(...)/Form(...) as parameter defaults by design
lint.per-file-ignores."server.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

# No type stubs available (heavy ML deps are also not installed in CI; soundfile is)
[[tool.mypy.overrides]]
module = ["librosa", "nemo.*", "pocket_tts", "scipy.*", "soundfile"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
